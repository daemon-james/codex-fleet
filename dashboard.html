<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>codex-fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --raise:#f8f9fa; --sunk:#eceef1;
  --ink:#15191f; --ink2:#434b55; --dim:#7b848f; --faint:#a7aeb7; --line:#e1e4e8; --line2:#cfd4da;
  --accent:#3a4250; --accent-soft:#e8eaee; --accent-ink:#1f252d; --link:#1d5fb4;
  --run:#16865a; --run-soft:#e3f4ec;
  --fail:#cc3a36; --fail-soft:#fcebea;
  --idle:#7b848f; --idle-soft:#eef0f2;
  --cmd:#147a7a; --cmd-soft:#dff3f1; --file:#8a5a12; --file-soft:#fbefd9;
  --tool:#6b4fb5; --tool-soft:#ece6fb; --think:#6f7782; --think-soft:#eceef1;
  --code-bg:#f1f3f5; --pre-bg:#f6f7f9;
  --shadow:0 1px 2px rgba(16,20,28,.04),0 6px 20px rgba(16,20,28,.05);
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f1114; --panel:#16191d; --raise:#1b1f24; --sunk:#111316;
  --ink:#e8ebee; --ink2:#b4bbc4; --dim:#7f8893; --faint:#5b636d; --line:#252a31; --line2:#343b44;
  --accent:#c3cad3; --accent-soft:#252b33; --accent-ink:#eef1f4; --link:#8fbcf3;
  --run:#3fcf8e; --run-soft:#132b21;
  --fail:#ff7a75; --fail-soft:#33191b;
  --idle:#7f8893; --idle-soft:#20242a;
  --cmd:#5fcfc4; --cmd-soft:#11302d; --file:#e3b766; --file-soft:#322815;
  --tool:#bfa9f6; --tool-soft:#281f3f; --think:#97a0ab; --think-soft:#20252b;
  --code-bg:#22272e; --pre-bg:#1b2026;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3);
}}

/* Type scale follows the viewport so a 4K monitor gets a larger base than a
   laptop, and everything below is in rem so one number moves the whole page. */
html{font-size:clamp(15px,0.4vw + 10px,20px)}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);font-size:1rem;line-height:1.6;
  background:var(--bg);color:var(--ink);
  display:grid;grid-template-columns:clamp(300px,22vw,460px) 1fr;height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---- sidebar ---- */
#side{border-right:1px solid var(--line);overflow:auto;background:var(--panel);
  scrollbar-width:thin;scrollbar-color:var(--line2) transparent;display:flex;flex-direction:column}
#side::-webkit-scrollbar{width:10px}
#side::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:3px solid var(--panel)}
#head{position:sticky;top:0;z-index:5;background:var(--panel);
  padding:1.4rem 1.4rem 1rem;border-bottom:1px solid var(--line)}
#head h1{margin:0;font-size:1.05rem;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:.6rem}
#head .count{margin-top:.2rem;font-size:.85rem;color:var(--dim)}
.spark{width:.55rem;height:.55rem;border-radius:99px;background:var(--run);flex:0 0 auto;
  box-shadow:0 0 0 .25rem var(--run-soft)}
.spark.off{background:var(--faint);box-shadow:none}
#runs{padding:.6rem .8rem 1.5rem}
.grp{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  padding:1rem .6rem .45rem}
.grp:first-child{padding-top:.5rem}
.run{display:block;width:100%;text-align:left;padding:.75rem .85rem;border-radius:.7rem;margin-bottom:.15rem;
  border:1px solid transparent;transition:background .12s,border-color .12s}
.run:hover{background:var(--raise)}
.run.sel{background:var(--accent-soft);border-color:transparent}
.run .top{display:flex;align-items:center;gap:.5rem;min-width:0}
.run .nm{font-weight:600;font-size:.98rem;letter-spacing:-.005em;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pill{font-size:.7rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:.15rem .5rem;border-radius:99px;flex:0 0 auto;line-height:1.5;margin-left:auto;
  display:inline-flex;align-items:center;gap:.35rem}
.pill.running{background:var(--run-soft);color:var(--run)}
.pill.idle,.pill.stopped{background:var(--idle-soft);color:var(--idle)}
.pill.failed{background:var(--fail-soft);color:var(--fail)}
.pill.running::before{content:"";width:.4rem;height:.4rem;border-radius:99px;
  background:currentColor;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.run .meta{margin-top:.3rem;font-size:.8rem;color:var(--dim);display:flex;gap:.4rem;flex-wrap:wrap;
  font-variant-numeric:tabular-nums}
.run .meta .sep{color:var(--faint)}
.run .last{margin-top:.35rem;font-size:.86rem;color:var(--ink2);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.run.sel .last{color:var(--ink)}

/* ---- main column ---- */
#main{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--bg)}
#bar{padding:1.4rem 2.5rem 0;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
#ident{display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap}
#title{font-size:1.45rem;font-weight:600;letter-spacing:-.02em;line-height:1.25}
#ident .pill{margin-left:0;align-self:center}
#facts{display:flex;gap:1.6rem 2.2rem;flex-wrap:wrap;margin-top:.9rem;min-height:1.2rem}
.fact{display:flex;flex-direction:column;gap:.05rem;min-width:0}
.fact .k{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.fact .v{font-size:.92rem;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:34rem}
.fact .v.mono{font-family:var(--mono);font-size:.86rem}
#tools{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:1rem 0 1rem;margin-top:.6rem;
  border-top:1px solid var(--line)}
#tools .lbl{font-size:.78rem;color:var(--dim);margin-right:.1rem}
.tg{font-size:.82rem;color:var(--dim);user-select:none;padding:.3rem .7rem;
  border:1px solid var(--line);border-radius:99px;background:var(--panel);transition:all .12s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:.4rem}
.tg:hover{border-color:var(--line2);color:var(--ink2)}
.tg[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:500}
/* A pressed toggle wears the colour of the rows it controls. */
.tg[data-f="think"][aria-pressed="true"]{background:var(--think-soft);color:var(--think)}
.tg[data-f="cmd"][aria-pressed="true"]{background:var(--cmd-soft);color:var(--cmd)}
.tg[data-f="file"][aria-pressed="true"]{background:var(--file-soft);color:var(--file)}
.tg[data-f="tool"][aria-pressed="true"]{background:var(--tool-soft);color:var(--tool)}
.tg[data-f="meta"][aria-pressed="true"]{background:var(--idle-soft);color:var(--ink2)}
.tg[aria-pressed="true"] .g{opacity:1}
.tg .g{font-family:var(--mono);font-size:.8rem;opacity:.8}

/* Filtering is class-driven so it is instant on a log of any length. */
body.h-think .ev.think{display:none}
body.h-cmd .ev.cmd{display:none}
.ev.cmd-start{display:none}
body.h-file .ev.file{display:none}
body.h-tool .ev.tool{display:none}
body.h-meta .ev.meta,body.h-meta .ev.todo{display:none}

/* ---- stream ---- */
#wrap{flex:1;position:relative;min-height:0}
#log{height:100%;overflow:auto;padding:2rem 2.5rem 4rem 4.7rem;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#log::-webkit-scrollbar{width:12px}
#log::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:4px solid var(--bg)}
#stream{max-width:none}
.ev{display:grid;grid-template-columns:1.6rem minmax(0,1fr);column-gap:.6rem;margin:0 0 0 -2.2rem;padding:.12rem 0}
.ev .g{font-family:var(--mono);font-size:.78rem;font-weight:500;text-align:center;color:var(--faint);user-select:none;
  height:1.45rem;line-height:1.45rem;border-radius:.4rem;margin-top:.1rem;background:var(--idle-soft)}
.ev.think .g{background:var(--think-soft)}
.ev.cmd .g{background:var(--cmd-soft)}
.ev.file .g{background:var(--file-soft)}
.ev.tool .g{background:var(--tool-soft)}
.ev.fail .g{background:var(--fail-soft)}
.ev.msg .g{background:var(--raise)}
.ev.meta .g,.ev.todo .g{background:none}
.ev .t{min-width:0;white-space:pre-wrap;word-break:break-word;font-size:.88rem;color:var(--ink2);line-height:1.6}
.ev.think .g{color:var(--think)}
.ev.think .t{color:var(--think);font-size:.88rem}
.ev.think .t strong{font-weight:500;color:var(--think)}
.ev.think .t.md{white-space:normal}
.ev.cmd .t,.ev.file .t,.ev.tool .t{font-family:var(--mono);font-size:.82rem;line-height:1.65}
.ev.cmd .g,.ev.cmd .t{color:var(--cmd)}
.ev.cmd .t .out{display:block;color:var(--dim);margin-top:.15rem}
.ev.cmd .t .sh{color:var(--dim);opacity:.7}
.ev.file .g,.ev.file .t{color:var(--file)}
.ev.tool .g,.ev.tool .t{color:var(--tool)}
.ev.meta .t,.ev.todo .t{color:var(--dim);font-size:.82rem}
.ev .x{display:inline-block;font-family:var(--sans);font-size:.68rem;font-weight:600;letter-spacing:.04em;
  color:var(--fail);background:var(--fail-soft);border-radius:99px;padding:0 .45rem;margin-left:.5rem;vertical-align:.1em}
.ev.fail{margin:.6rem 0}
.ev.fail .g{color:var(--fail)}
.ev.fail .t{color:var(--fail);background:var(--fail-soft);border-radius:.6rem;padding:.6rem .9rem}

/* The agent's own words are the thing being read, so they get the page's
   body size, a card, and room around them. Everything else is activity. */
.ev.msg{margin:1.1rem 0 1.3rem}
.ev.msg .g{color:var(--ink2);margin-top:1.1rem}
.ev.msg .t{white-space:normal;font-size:1rem;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:.9rem;padding:1.1rem 1.4rem 1.2rem;box-shadow:var(--shadow);
  line-height:1.65;max-width:120ch}
.md>:first-child{margin-top:0}
.md>:last-child{margin-bottom:0}
.md p{margin:0 0 .8em}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{line-height:1.3;margin:1.3em 0 .5em;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.md h1{font-size:1.3em}.md h2{font-size:1.18em}.md h3{font-size:1.06em}.md h4,.md h5,.md h6{font-size:1em}
.md ul,.md ol{margin:.3em 0 .9em;padding-left:1.6em}
.md li{margin:.25em 0}
.md li>p{margin:.35em 0}
.md li>ul,.md li>ol{margin:.3em 0 .4em}
.md code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);border-radius:.3em;padding:.05em .3em;color:var(--ink)}
.md pre{font-family:var(--mono);font-size:.84em;line-height:1.55;background:var(--pre-bg);border:1px solid var(--line);
  border-radius:.6rem;padding:.9em 1.1em;overflow-x:auto;margin:.7em 0 1em;white-space:pre}
.md pre code{background:none;padding:0;font-size:1em;border-radius:0}
.md blockquote{margin:.7em 0 1em;padding:.2em 0 .2em 1em;border-left:3px solid var(--line2);color:var(--ink2)}
.md a{color:var(--link);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:.15em}
.md a:hover{text-decoration-color:currentColor}
.md a.path{font-family:var(--mono);font-size:.86em;text-decoration:none;background:var(--code-bg);border-radius:.35em;padding:.1em .4em}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.md table{border-collapse:collapse;margin:.7em 0 1em;font-size:.92em;display:block;overflow-x:auto;max-width:100%}
.md th,.md td{border:1px solid var(--line);padding:.4em .8em;text-align:left;vertical-align:top}
.md th{background:var(--raise);font-weight:600}
.md strong{font-weight:600;color:var(--ink)}
.md .chk{font-family:var(--mono);color:var(--dim);margin-right:.3em}

#jump{position:absolute;right:2.5rem;bottom:1.6rem;padding:.55rem 1.1rem;border:1px solid var(--line);
  border-radius:99px;background:var(--panel);color:var(--ink);font-size:.86rem;
  font-weight:500;box-shadow:var(--shadow);transition:all .12s}
#jump:hover{border-color:var(--line2);color:var(--ink);transform:translateY(-1px)}
#empty{color:var(--dim);padding:5rem 0;font-size:1rem;line-height:1.6}
#empty code{font-family:var(--mono);font-size:.9em;color:var(--ink2)}
body.none #tools{display:none}

@media(prefers-reduced-motion:reduce){.pill.running::before{animation:none}#jump{transition:none}}
@media(max-width:860px){
  body{grid-template-columns:1fr;grid-template-rows:40vh 1fr}
  #side{border-right:0;border-bottom:1px solid var(--line)}
  #bar{padding-left:1.2rem;padding-right:1.2rem}
  #log{padding-left:3.4rem;padding-right:1.2rem}
  #jump{right:1.2rem}
}
</style></head><body>
<div id="side">
  <div id="head">
    <h1><span class="spark off" id="spark"></span>codex-fleet</h1>
    <div class="count" id="count">loading</div>
  </div>
  <div id="runs"></div>
</div>
<div id="main">
  <div id="bar">
    <div id="ident"><span id="title">codex-fleet</span><span id="status"></span></div>
    <div id="facts"></div>
    <div id="tools">
      <span class="lbl">Show</span>
      <button class="tg" data-f="think" aria-pressed="true"><span class="g">~</span>reasoning</button>
      <button class="tg" data-f="cmd" aria-pressed="true"><span class="g">$</span>commands</button>
      <button class="tg" data-f="file" aria-pressed="true"><span class="g">&plusmn;</span>file edits</button>
      <button class="tg" data-f="tool" aria-pressed="true"><span class="g">&#9881;</span>tool calls</button>
      <button class="tg" data-f="meta" aria-pressed="false"><span class="g">&middot;</span>turn markers</button>
      <button class="tg" id="tg-verb" aria-pressed="false"><span class="g">&#8801;</span>full output</button>
    </div>
  </div>
  <div id="wrap">
    <div id="log"><div id="stream"><div id="empty">No runs yet. Spawn one with <code>codex-fleet spawn</code> and it appears here.</div></div></div>
    <button id="jump" hidden>Newer events &darr;</button>
  </div>
</div>
<script>
let sel=null,next=0,verbose=false;
const $=id=>document.getElementById(id);
const log=$("log"),stream=$("stream");
const esc=t=>(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function j(u){const r=await fetch(u);return r.json()}

/* ---- markdown: enough for what an agent writes, nothing more ---- */
function inline(s){
  const code=[];
  s=esc(s).replace(/`([^`]+)`/g,function(_,c){code.push(c);return "\u0000"+(code.length-1)+"\u0000"});
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(_,t,u){
    const path=/^\/|^\.{1,2}\//.test(u)?" class=\"path\"":"";
    return "<a"+path+" href=\""+u+"\">"+t+"</a>"});
  s=s.replace(/(^|\s)(https?:\/\/[^\s<]+)/g,"$1<a href=\"$2\">$2</a>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?=[^*\w]|$)/g,"$1<em>$2</em>");
  s=s.replace(/(^|[^\w])_([^_\s][^_]*?)_(?=[^\w]|$)/g,"$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g,function(_,i){return "<code>"+code[+i]+"</code>"});
}
const ITEM=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
function md(src){
  const lines=src.replace(/\r/g,"").split("\n");
  const out=[],para=[];let i=0,m;
  function flush(){if(para.length){out.push("<p>"+inline(para.join(" "))+"</p>");para.length=0}}
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*```/.test(l)){flush();const buf=[];i++;
      while(i<lines.length&&!/^\s*```/.test(lines[i])){buf.push(lines[i]);i++}
      i++;out.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>");continue}
    if((m=/^(#{1,6})\s+(.*)$/.exec(l))){flush();const n=m[1].length;
      out.push("<h"+n+">"+inline(m[2].replace(/\s+#+\s*$/,""))+"</h"+n+">");i++;continue}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){flush();out.push("<hr>");i++;continue}
    if(/^\s*>/.test(l)){flush();const buf=[];
      while(i<lines.length&&/^\s*>/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,""));i++}
      out.push("<blockquote>"+md(buf.join("\n"))+"</blockquote>");continue}
    if(ITEM.test(l)){flush();const r=list(lines,i);out.push(r.html);i=r.next;continue}
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<lines.length&&/^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
      flush();const r=table(lines,i);out.push(r.html);i=r.next;continue}
    if(!l.trim()){flush();i++;continue}
    para.push(l.trim());i++;
  }
  flush();return out.join("");
}
function list(lines,i){
  const first=ITEM.exec(lines[i]);
  const indent=first[1].length,ordered=/\d/.test(first[2]),tag=ordered?"ol":"ul";
  const start=ordered?parseInt(first[2],10):1;
  const items=[];let cur=null;
  while(i<lines.length){
    const l=lines[i],mm=ITEM.exec(l);
    if(mm&&mm[1].length===indent&&/\d/.test(mm[2])===ordered){cur=[mm[3]];items.push(cur);i++;continue}
    if(mm&&mm[1].length<=indent)break;
    if(!l.trim()){
      let k=i+1;while(k<lines.length&&!lines[k].trim())k++;
      if(k<lines.length){const ind=/^\s*/.exec(lines[k])[0].length,isItem=ITEM.test(lines[k]);
        if(ind>indent||(isItem&&ind===indent)){if(cur)cur.push("");i=k;continue}}
      break;
    }
    const ind=/^\s*/.exec(l)[0].length;
    if(ind<indent)break;
    if(!cur)break;
    const body=indent+first[2].length+1;
    cur.push(ind>=body?l.slice(body):l.trim());i++;
  }
  const html=items.map(function(it){
    let h=md(it.join("\n").replace(/^\[([ xX])\]\s+/,function(_,c){return "\u0001"+(c===" "?"0":"1")+"\u0001 "}));
    if(/^<p>[^]*<\/p>$/.test(h)&&h.indexOf("<p>",1)<0)h=h.slice(3,-4);
    h=h.replace(/\u0001([01])\u0001/g,function(_,c){return "<span class=\"chk\">"+(c==="1"?"&#9745;":"&#9744;")+"</span>"});
    return "<li>"+h+"</li>"}).join("");
  const attr=ordered&&start!==1?" start=\""+start+"\"":"";
  return {html:"<"+tag+attr+">"+html+"</"+tag+">",next:i};
}
function cells(l){return l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim())}
function table(lines,i){
  const head=cells(lines[i]);i+=2;const rows=[];
  while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(cells(lines[i]));i++}
  const h="<thead><tr>"+head.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead>";
  const b="<tbody>"+rows.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody>";
  return {html:"<table>"+h+b+"</table>",next:i};
}

/* ---- one event row ---- */
const LEAD=/^(▸|~|→|±|☑|⚙|⌕|✗|·|\$(\[\d+\])?)\s?/;
function row(e){
  const div=document.createElement("div");div.className="ev "+e.kind;
  let text=e.text||"",glyph="",exit="";
  const m=LEAD.exec(text);
  if(m){glyph=m[1];text=text.slice(m[0].length);
    if(m[2]){exit=m[2].slice(1,-1);glyph="$"}}
  const g=document.createElement("span");g.className="g";g.textContent=glyph;
  const t=document.createElement("div");t.className="t";
  if(e.kind==="msg"||e.kind==="think"){t.className="t md";t.innerHTML=md(text)}
  else if(e.kind==="cmd"){
    const nl=text.indexOf("\n");
    const head=nl<0?text:text.slice(0,nl);
    const sh=/^(\/bin\/(?:ba)?sh|bash|sh|zsh)\s+-l?c\s+/.exec(head);
    if(sh){const w=document.createElement("span");w.className="sh";w.textContent=sh[0];t.appendChild(w);
      t.appendChild(document.createTextNode(head.slice(sh[0].length)))}
    else t.textContent=head;
    if(nl>=0){const o=document.createElement("span");o.className="out";
      o.textContent=text.slice(nl+1).replace(/^ {4}/gm,"");t.appendChild(o)}
    if(exit){const x=document.createElement("span");x.className="x";x.textContent="exit "+exit;t.insertBefore(x,t.querySelector(".out"))}
  }
  else t.textContent=text;
  div.appendChild(g);div.appendChild(t);return div;
}

/* ---- sidebar and header ---- */
const plainMd=s=>(s||"").replace(/[*_`#>]/g,"").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1");
function pick(name){if(sel===name)return;sel=name;next=0;stream.innerHTML="";log.scrollTop=0;
  $("jump").hidden=true;$("title").textContent=name;draw();poll()}
function fact(k,v,mono){return "<div class=\"fact\"><span class=\"k\">"+k+"</span><span class=\"v"+(mono?" mono":"")+"\" title=\""+esc(v)+"\">"+esc(v)+"</span></div>"}
async function draw(){
  const runs=await j("/api/runs");
  if(!sel&&runs.length){sel=runs[0].name;$("title").textContent=sel;poll()}
  document.body.classList.toggle("none",!runs.length);
  const live=runs.filter(r=>r.status==="running");
  $("spark").className="spark"+(live.length?"":" off");
  $("count").textContent=live.length?(live.length+" running, "+runs.length+" total"):(runs.length+" runs, none active");
  const card=function(r){
    return "<button class=\"run "+(r.name===sel?"sel":"")+"\" data-n=\""+esc(r.name)+"\">"
      +"<div class=\"top\"><span class=\"nm\">"+esc(r.name)+"</span>"
      +"<span class=\"pill "+r.status+"\">"+r.status+"</span></div>"
      +"<div class=\"meta\"><span>"+esc(r.role)+"</span><span class=\"sep\">&middot;</span>"
      +"<span>"+esc(r.effort)+"</span><span class=\"sep\">&middot;</span>"
      +"<span>"+r.out.toLocaleString()+" tok</span><span class=\"sep\">&middot;</span>"
      +"<span>"+esc(r.age)+"</span></div>"
      +"<div class=\"last\">"+esc(plainMd(r.last))+"</div></button>";
  };
  const rest=runs.filter(r=>r.status!=="running");
  let html="";
  if(live.length)html+="<div class=\"grp\">Running ("+live.length+")</div>"+live.map(card).join("");
  if(rest.length)html+="<div class=\"grp\">Finished ("+rest.length+")</div>"+rest.map(card).join("");
  $("runs").innerHTML=html;
  document.querySelectorAll(".run").forEach(e=>e.onclick=()=>pick(e.dataset.n));
  const cur=runs.find(r=>r.name===sel);
  $("status").innerHTML=cur?"<span class=\"pill "+cur.status+"\">"+cur.status+"</span>":"";
  $("facts").innerHTML=cur?[
    fact("Role",cur.role),fact("Model",cur.model,true),fact("Effort",cur.effort),
    fact("Sandbox",cur.sandbox,true),fact("Turns",String(cur.turns)),
    fact("Output",cur.out.toLocaleString()+" tokens"),fact("Last activity",cur.age+" ago"),
    fact("Directory",cur.cwd,true)].join(""):"";
}
async function poll(){
  if(!sel)return;
  const d=await j("/api/events?name="+encodeURIComponent(sel)+"&from="+next+"&verbose="+(verbose?1:0));
  if(d.events&&d.events.length){
    const e0=$("empty");if(e0)e0.remove();
    // Measure BEFORE appending: was the reader at the bottom a moment ago?
    const stick=atBottom();
    for(const e of d.events)stream.appendChild(row(e));
    if(stick)log.scrollTop=log.scrollHeight;else $("jump").hidden=false;
  }
  next=d.total;
}
function atBottom(){return log.scrollHeight-log.scrollTop-log.clientHeight<80}
log.addEventListener("scroll",()=>{if(atBottom())$("jump").hidden=true});
$("jump").onclick=()=>{log.scrollTop=log.scrollHeight;$("jump").hidden=true};
// Each toggle maps to one body class. Pressed means show, so the class it
// toggles is the hide-class; turn markers start hidden. In-flight command
// notices are never shown in the browser; the CLI tail still prints them.
document.querySelectorAll(".tg[data-f]").forEach(function(el){
  const f=el.dataset.f;
  document.body.classList.toggle("h-"+f,el.getAttribute("aria-pressed")!=="true");
  el.onclick=function(){
    const on=el.getAttribute("aria-pressed")!=="true";
    el.setAttribute("aria-pressed",on?"true":"false");
    document.body.classList.toggle("h-"+f,!on);
  };
});
$("tg-verb").onclick=function(){verbose=!verbose;this.setAttribute("aria-pressed",verbose?"true":"false");
  next=0;stream.innerHTML="";$("jump").hidden=true;
  poll().then(()=>{log.scrollTop=log.scrollHeight})};
draw();setInterval(draw,2000);setInterval(poll,1200);
</script></body></html>
